services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    volumes:
      - ./synthetic_data:/synthetic_data:ro
      - ./database:/database
    environment:
      - DUCKDB_PATH=/database/sql_to_dbt_guide.duckdb
    container_name: dbt_database_processor
    command: python sources.py

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    volumes:
      - ./database:/database
      - ./dbt:/app/dbt
    environment:
      - DUCKDB_PATH=/database/sql_to_dbt_guide.duckdb
      - INPUT_FILES_PATH=${INPUT_FILES_PATH}
    container_name: dbt_runner
    depends_on:
      database:
        condition: service_completed_successfully
    command: sh -c "dbt deps && dbt run"

  dbt-docs:
    image: sql-to-dbt-dbt
    ports:
      - "9000:9000"
    volumes:
      - ./database:/database
      - ./dbt:/app/dbt
    environment:
      - DUCKDB_PATH=/database/sql_to_dbt_guide.duckdb
      - INPUT_FILES_PATH=${INPUT_FILES_PATH}
    container_name: dbt_docs_server
    depends_on:
      dbt:
        condition: service_completed_successfully
    command: sh -c "dbt docs generate && dbt docs serve --host 0.0.0.0 --port 9000"

  dbt-colibri:
    image: sql-to-dbt-dbt
    ports:
      - "8080:8080"
    volumes:
      - ./database:/database
      - ./dbt:/app/dbt
    environment:
      - DUCKDB_PATH=/database/sql_to_dbt_guide.duckdb
      - INPUT_FILES_PATH=${INPUT_FILES_PATH}
    container_name: dbt_colibri_server
    depends_on:
      dbt:
        condition: service_completed_successfully
    command: sh -c "dbt compile && dbt docs generate && colibri generate && echo '🔗 dbt-colibri lineage dashboard available at http://localhost:8080' && python -m http.server 8080 --directory dist"